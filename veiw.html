<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, interactive-widget=overlays-content">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#0d1b2a">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <title>Детали расчётов</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    :root {
      --primary: #1e2b3a;
      --secondary: #4A4A4A;
      --accent: #e9c46a;
      --danger: #c44536;
      --success: #2a9d8f;
      --light: #f4f9f9;
      --dark: #0d1b2a;
      --border: #adb5bd;
      --card-bg: rgba(255, 255, 255, 0.7);
      --red-poly: #b23b2c;
      --orange: #f4a261;
      --app-height: 100vh;
      --spring-easing: cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    
    body {
      font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
      background: var(--dark);
      color: #000000;
      min-height: var(--app-height, 100vh);
      padding: 8px;
      overflow-x: hidden;
    }
    
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: var(--app-height, 100%);
      background: rgba(0, 0, 0, 0.15);
      pointer-events: none;
      z-index: 0;
    }
    
    .container {
      max-width: 480px;
      margin: 0 auto;
      padding: 8px;
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    
    h1 {
      text-align: center;
      color: var(--primary);
      font-size: 1.6rem;
      font-weight: 600;
      text-shadow: 0 1px 3px rgba(255, 255, 255, 0.8);
      padding: 16px 12px;
      background: var(--card-bg);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 4px;
      animation: cardBuildIn 0.55s var(--spring-easing) both;
    }
    
    .meta-info {
      background: var(--card-bg);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-radius: 20px;
      padding: 12px 16px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 0.8rem;
      color: var(--primary);
      text-shadow: 0 1px 2px rgba(255, 255, 255, 0.5);
      animation: cardBuildIn 0.55s var(--spring-easing) 0.06s both;
    }
    
    .meta-info .version-tag { opacity: 0.7; }
    .meta-info .date-tag { opacity: 0.7; }
    
    .meta-info .count {
      background: var(--secondary);
      color: white;
      padding: 2px 14px;
      border-radius: 40px;
      font-size: 0.8rem;
      font-weight: 600;
    }
    
    .card {
      background: var(--card-bg);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-radius: 28px;
      padding: 18px 16px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
      animation: cardBuildIn 0.55s var(--spring-easing) both;
      animation-delay: calc(var(--card-idx, 0) * 90ms + 100ms);
      transition: transform 0.22s var(--spring-easing);
    }

    .card:active {
      transform: scale(0.985);
    }
    
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
      border-bottom: 2px solid var(--secondary);
      padding-bottom: 10px;
      margin-bottom: 12px;
    }
    
    .card-header .weapon-name {
      color: var(--primary);
      font-size: 1.1rem;
      font-weight: 600;
      text-shadow: 0 1px 2px rgba(255, 255, 255, 0.5);
    }
    
    .card-header .badge {
      background: var(--secondary);
      color: white;
      border-radius: 40px;
      padding: 2px 14px;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.3px;
    }
    
    .detail-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 0;
      border-bottom: 1px solid rgba(222, 226, 230, 0.3);
      animation: rowSlideIn 0.42s var(--spring-easing) both;
      animation-delay: calc(var(--card-idx, 0) * 90ms + var(--row-idx, 0) * 35ms + 160ms);
    }
    
    .detail-item:last-of-type {
      border-bottom: none;
    }
    
    .detail-item .label {
      font-size: 0.85rem;
      color: var(--primary);
      opacity: 0.7;
      font-weight: 500;
      text-shadow: 0 1px 2px rgba(255, 255, 255, 0.3);
    }
    
    .detail-item .value {
      font-size: 0.95rem;
      color: var(--primary);
      font-weight: 600;
      text-shadow: 0 1px 2px rgba(255, 255, 255, 0.5);
    }
    
    .detail-item .value.highlight {
      color: var(--red-poly);
    }

    /* ==== Барабан цифр ==== */
    .odometer-wrap {
      display: inline-flex;
      align-items: baseline;
      justify-content: center;
      line-height: 1.2;
      font-variant-numeric: tabular-nums;
    }
    .odo-digit-window {
      display: inline-block;
      height: 1.2em;
      overflow: hidden;
      vertical-align: bottom;
      position: relative;
    }
    .odo-ribbon {
      display: flex;
      flex-direction: column;
      will-change: transform;
    }
    .odo-cell {
      height: 1.2em;
      line-height: 1.2em;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .odo-static {
      display: inline-block;
      line-height: 1.2em;
      white-space: pre;
    }

    /* ==== Блок "Введенные значения" для расчетов в режиме "Ручной ввод" ==== */
    .manual-values-title {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--primary);
      margin: 10px 0 8px;
      text-shadow: 0 1px 2px rgba(255, 255, 255, 0.5);
    }
    .manual-values-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 8px;
    }
    .manual-value-chip {
      flex: 1 1 45%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.7);
      border-radius: 16px;
      padding: 8px 12px;
      font-size: 0.85rem;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
      animation: rowSlideIn 0.42s var(--spring-easing) both;
      animation-delay: calc(var(--chip-idx, 0) * 35ms + 140ms);
    }
    .manual-value-chip .mv-label { opacity: 0.75; font-weight: 500; color: var(--primary); }
    .manual-value-chip .mv-value { font-weight: 700; color: var(--primary); }
    
    .timestamp {
      font-size: 0.75rem;
      color: var(--primary);
      opacity: 0.6;
      margin-top: 10px;
      border-top: 1px solid rgba(222, 226, 230, 0.5);
      padding-top: 10px;
      text-shadow: 0 1px 2px rgba(255, 255, 255, 0.3);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .error, .loading, .empty-state {
      background: var(--card-bg);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-radius: 28px;
      padding: 40px 20px;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.3);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
      animation: cardBuildIn 0.5s var(--spring-easing) both;
    }

    .error { color: var(--danger); font-size: 1.2rem; }
    .loading { color: var(--primary); font-size: 1.1rem; text-shadow: 0 1px 2px rgba(255, 255, 255, 0.5); }
    .empty-state .icon { font-size: 3rem; margin-bottom: 12px; opacity: 0.5; }
    .empty-state p { color: var(--primary); font-size: 1rem; text-shadow: 0 1px 2px rgba(255, 255, 255, 0.5); }
    
    .footer {
      text-align: center;
      color: var(--primary);
      font-size: 0.75rem;
      margin-top: 8px;
      opacity: 0.6;
      text-shadow: 0 1px 2px rgba(255, 255, 255, 0.5);
      padding: 8px 0;
    }

    @keyframes cardBuildIn {
      0% { opacity: 0; transform: perspective(700px) rotateX(-25deg) translateY(24px) scale(0.92); }
      100% { opacity: 1; transform: perspective(700px) rotateX(0deg) translateY(0) scale(1); }
    }
    @keyframes rowSlideIn {
      0% { opacity: 0; transform: translateX(-14px); }
      100% { opacity: 1; transform: translateX(0); }
    }
  </style>
  <link rel="stylesheet" href="css/night-theme.css">
</head>
<body>
<!-- ARTBALL-THEME-PATCH-V1 -->
<div id="bg-day"></div>
<div id="bg-night"></div>
<script>
  (function () {
    try {
      var h = new Date().getHours();
      var night = (h >= 21 || h < 7);
      document.body.classList.toggle('night-theme', night);
      var bgDay = document.getElementById('bg-day');
      var bgNight = document.getElementById('bg-night');
      if (bgDay) bgDay.style.opacity = night ? '0' : '1';
      if (bgNight) bgNight.style.opacity = night ? '1' : '0';
    } catch (e) {}
  })();
</script>
<script>
  // ==== ЗАМОК ВЫСОТЫ ФОНА ====
  (function () {
    var maxH = window.innerHeight;
    function applyAppHeight(h) {
      document.documentElement.style.setProperty('--app-height', h + 'px');
      var bgDay = document.getElementById('bg-day');
      var bgNight = document.getElementById('bg-night');
      if (bgDay) bgDay.style.height = h + 'px';
      if (bgNight) bgNight.style.height = h + 'px';
    }
    applyAppHeight(maxH);
    window.addEventListener('resize', function () {
      if (window.innerHeight > maxH) {
        maxH = window.innerHeight;
        applyAppHeight(maxH);
      }
    });
  })();
</script>
<div class="container">
  <h1><i class="fas fa-history"></i> Детали расчётов</h1>
  <div id="content">
    <div class="loading">⏳ Загрузка данных...</div>
  </div>
  <div class="footer">Создан Романовым А. В. / моб. версия</div>
</div>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

<script>
  function animateOdometerElement(el) {
    const text = el.textContent.trim();
    if (!/\d/.test(text)) return;
    el.innerHTML = '';
    const wrap = document.createElement('span');
    wrap.className = 'odometer-wrap';
    let dIdx = 0;
    for (let i = 0; i < text.length; i++) {
      const ch = text[i];
      if (ch >= '0' && ch <= '9') {
        const target = parseInt(ch, 10);
        const start = (target + 5) % 10;
        const win = document.createElement('span');
        win.className = 'odo-digit-window';
        const ribbon = document.createElement('span');
        ribbon.className = 'odo-ribbon';
        for (let c = 0; c < 2; c++) {
          for (let d = 0; d <= 9; d++) {
            const cell = document.createElement('span');
            cell.className = 'odo-cell';
            cell.textContent = String(d);
            ribbon.appendChild(cell);
          }
        }
        let tgtIdx = 10 + target;
        ribbon.style.transform = 'translateY(-' + (start * 1.2) + 'em)';
        win.appendChild(ribbon);
        wrap.appendChild(win);
        const dur = 580 + dIdx * 90;
        (function (rb, ti, dr) {
          requestAnimationFrame(function () {
            requestAnimationFrame(function () {
              rb.style.transition = 'transform ' + dr + 'ms cubic-bezier(0.16, 1, 0.3, 1)';
              rb.style.transform = 'translateY(-' + (ti * 1.2) + 'em)';
            });
          });
        })(ribbon, tgtIdx, dur);
        dIdx++;
      } else {
        const st = document.createElement('span');
        st.className = 'odo-static';
        st.textContent = ch;
        wrap.appendChild(st);
      }
    }
    el.appendChild(wrap);
  }

  (function() {
    const params = new URLSearchParams(window.location.search);
    const gistId = params.get('id') || params.get('shared');
    const container = document.getElementById('content');

    if (!gistId) {
      container.innerHTML = `
        <div class="error">
          <i class="fas fa-exclamation-triangle"></i> Не указан ID истории
        </div>
      `;
      return;
    }

    async function loadGist(id) {
      try {
        const response = await fetch(`https://api.github.com/gists/${id}`, {
          headers: { 'Accept': 'application/json' }
        });

        if (!response.ok) {
          if (response.status === 404) {
            throw new Error('Данные не найдены или удалены');
          }
          throw new Error('Ошибка загрузки: ' + response.status);
        }

        const gist = await response.json();
        const files = gist.files;

        let content = null;
        for (const filename in files) {
          if (filename.endsWith('.json')) {
            content = files[filename].content;
            break;
          }
        }

        if (!content) {
          throw new Error('Нет данных в Gist');
        }

        const data = JSON.parse(content);
        const history = data.history || [];
        const version = data.version || 'неизвестно';
        const timestamp = data.timestamp ? new Date(data.timestamp).toLocaleString('ru-RU', { hour12: false }) : 'неизвестно';

        if (history.length === 0) {
          container.innerHTML = `
            <div class="empty-state">
              <div class="icon">📭</div>
              <p>Нет расчётов в этой истории</p>
            </div>
          `;
          return;
        }

        let html = `
          <div class="meta-info">
            <span class="version-tag"><i class="fas fa-tag"></i> Версия: ${version}</span>
            <span class="count"><i class="fas fa-calculator"></i> ${history.length}</span>
            <span class="date-tag"><i class="fas fa-calendar-alt"></i> ${timestamp}</span>
          </div>
        `;

        history.forEach((entry, index) => {
          const weapon = entry.weapon || 'Орудие';
          const charge = entry.charge ?? '?';
          const elevation = entry.elevation !== undefined ? Math.round(entry.elevation) : '?';
          const flightTime = entry.flightTime ?? '?';
          const distance = Math.round(entry.distance || 0);
          const ownHeight = entry.ownHeight || 0;
          const targetHeight = entry.targetHeight || 0;
          const rangeCorr = Math.round(entry.rangeCorr ?? entry.rangeCorrection ?? 0);
          const heightCorr = Math.round(entry.heightCorr ?? entry.heightCorrection ?? 0);
          const time = entry.calculatedAt || entry.timestamp || 'Время не указано';
          const type = entry.type || 'Элеватор';
          const profileTumbler = entry.profileTumbler;
          const delayTumbler = entry.delayTumbler;
          const isRedpoly = type === 'Краснополь';
          const isManual = !!(entry.manualValues && entry.manualValues.length > 0);

          let manualHtml = '';
          if (isManual) {
            manualHtml = `
              <div class="manual-values-title">⌨️ Введенные значения:</div>
              <div class="manual-values-grid">
                ${entry.manualValues.map((mv, cIdx) => `
                  <div class="manual-value-chip" style="--chip-idx:${cIdx}">
                    <span class="mv-label">${mv.label}</span>
                    <span class="mv-value odo-val">${mv.value}</span>
                  </div>
                `).join('')}
              </div>
            `;
          }

          html += `
            <div class="card" style="--card-idx:${Math.min(index, 8)}">
              <div class="card-header">
                <span class="weapon-name"><i class="fas fa-crosshairs"></i> ${weapon}</span>
                <span class="badge">${type}</span>
              </div>
              ${manualHtml}
              ${isManual ? '' : `
              <div class="detail-item" style="--row-idx:1">
                <span class="label"><i class="fas fa-bullseye"></i> Дальность до цели</span>
                <span class="value odo-val">${distance} м</span>
              </div>
              <div class="detail-item" style="--row-idx:2">
                <span class="label"><i class="fas fa-mountain"></i> Своя высота</span>
                <span class="value odo-val">${ownHeight} м</span>
              </div>
              <div class="detail-item" style="--row-idx:3">
                <span class="label"><i class="fas fa-bullseye"></i> Высота цели</span>
                <span class="value odo-val">${targetHeight} м</span>
              </div>
              `}
              <div class="detail-item" style="--row-idx:4">
                <span class="label"><i class="fas fa-arrows-alt-h"></i> Поправка на дистанцию</span>
                <span class="value odo-val">${rangeCorr}</span>
              </div>
              <div class="detail-item" style="--row-idx:5">
                <span class="label"><i class="fas fa-arrows-alt-v"></i> Поправка на высоту</span>
                <span class="value odo-val">${heightCorr}</span>
              </div>
              ${isManual ? '' : `
              <div class="detail-item" style="--row-idx:6">
                <span class="label"><i class="fas fa-clock"></i> Полетное время</span>
                <span class="value odo-val">${flightTime} сек</span>
              </div>
              <div class="detail-item" style="--row-idx:7">
                <span class="label"><i class="fas fa-bolt"></i> Заряд</span>
                <span class="value odo-val">${charge}</span>
              </div>
              `}
              <div class="detail-item" style="--row-idx:8">
                <span class="label"><i class="fas fa-angle-up"></i> Элеватор</span>
                <span class="value odo-val">${elevation}</span>
              </div>
              ${isRedpoly && profileTumbler !== undefined ? `
                <div class="detail-item" style="--row-idx:9">
                  <span class="label"><i class="fas fa-sliders-h"></i> Тумблер профиля</span>
                  <span class="value highlight odo-val">${profileTumbler}</span>
                </div>
              ` : ''}
              ${isRedpoly && delayTumbler !== undefined ? `
                <div class="detail-item" style="--row-idx:10">
                  <span class="label"><i class="fas fa-hourglass-half"></i> Тумблер задержки</span>
                  <span class="value highlight odo-val">${delayTumbler}</span>
                </div>
              ` : ''}
              <div class="timestamp">
                <span><i class="fas fa-clock"></i> Время расчёта</span>
                <span>${time}</span>
              </div>
            </div>
          `;
        });

        container.innerHTML = html;
        container.querySelectorAll('.odo-val').forEach(animateOdometerElement);

      } catch (error) {
        container.innerHTML = `
          <div class="error">
            <i class="fas fa-exclamation-circle"></i> ${error.message}
          </div>
        `;
        console.error(error);
      }
    }

    loadGist(gistId);
  })();
</script>
<script src="js/theme.js"></script>
</body>
</html>
